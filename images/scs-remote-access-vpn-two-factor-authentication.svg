<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SCS評価制度に向けたリモートアクセスVPN認証強化</title>
  <desc id="desc">SCS評価制度の要求事項と、SingleIDによるリモートアクセスVPNの2要素認証で支援する対策、あわせて必要な設定と運用を整理した表</desc>
  <style>
    .title { font: 700 43px 'Noto Sans CJK JP', sans-serif; fill: #183047; }
    .brand { font: 700 25px 'Noto Sans CJK JP', sans-serif; fill: #087e88; }
    .sub { font: 400 25px 'Noto Sans CJK JP', sans-serif; fill: #526777; }
    .head { font: 700 22px 'Noto Sans CJK JP', sans-serif; fill: #fff; }
    .key { font: 700 21px 'Noto Sans CJK JP', sans-serif; fill: #183047; }
    .body { font: 400 20px 'Noto Sans CJK JP', sans-serif; fill: #183047; }
    .note { font: 400 17px 'Noto Sans CJK JP', sans-serif; fill: #526777; }
    .cell { stroke: #c9d6dc; stroke-width: 2; }
  </style>
  <rect width="1600" height="900" fill="#fff"/>
  <text class="brand" x="70" y="58">SingleID × リモートアクセスVPN</text>
  <text class="title" x="70" y="125">SCS評価制度に向けたリモートアクセスVPN認証強化</text>
  <text class="sub" x="70" y="172">パスワード＋OTP、またはパスワード＋クライアント証明書による2要素認証</text>

  <rect class="cell" x="70" y="215" width="430" height="58" fill="#183047"/>
  <rect class="cell" x="500" y="215" width="525" height="58" fill="#183047"/>
  <rect class="cell" x="1025" y="215" width="505" height="58" fill="#183047"/>
  <text class="head" x="92" y="252">SCS要求事項・評価基準</text>
  <text class="head" x="522" y="252">SingleIDで支援する対策</text>
  <text class="head" x="1047" y="252">あわせて必要な設定・運用</text>

  <rect class="cell" x="70" y="273" width="430" height="125" fill="#f3f7f9"/>
  <rect class="cell" x="500" y="273" width="525" height="125" fill="#f3f7f9"/>
  <rect class="cell" x="1025" y="273" width="505" height="125" fill="#f3f7f9"/>
  <text class="key" x="92" y="300"><tspan x="92">4-1-1-1～4-1-1-4</tspan><tspan x="92" dy="29">★3・★4</tspan><tspan x="92" dy="29">ユーザIDの管理手続</tspan></text>
  <text class="body" x="522" y="311"><tspan x="522">個別のユーザIDでVPN接続を管理</tspan><tspan x="522" dy="32">不要なID・接続権限を無効化</tspan></text>
  <text class="body" x="1047" y="311"><tspan x="1047">ID発行・変更・削除の申請承認</tspan><tspan x="1047" dy="32">共有IDの抑制／退職・異動時の対応</tspan></text>

  <rect class="cell" x="70" y="398" width="430" height="150" fill="#fff"/>
  <rect class="cell" x="500" y="398" width="525" height="150" fill="#fff"/>
  <rect class="cell" x="1025" y="398" width="505" height="150" fill="#fff"/>
  <text class="key" x="92" y="420"><tspan x="92">4-1-3-1　★3・★4</tspan><tspan x="92" dy="29">4-1-3-3・4-1-3-4　★3・★4</tspan><tspan x="92" dy="29">4-1-3-5　★4</tspan><tspan x="92" dy="29">認証の強度・実装方法の決定</tspan></text>
  <text class="body" x="522" y="431"><tspan x="522">ユーザ単位の認証／8文字以上のパスワード</tspan><tspan x="522" dy="31">パスワード＋OTP／証明書で2要素認証</tspan><tspan x="522" dy="31">上記4項目の対策を支援</tspan></text>
  <text class="body" x="1047" y="431"><tspan x="1047">両方の認証要素を必須化</tspan><tspan x="1047" dy="31">パスワードポリシー／OTP・証明書管理</tspan><tspan x="1047" dy="31">ローカル認証などの迂回経路を管理</tspan></text>

  <rect class="cell" x="70" y="548" width="430" height="125" fill="#f3f7f9"/>
  <rect class="cell" x="500" y="548" width="525" height="125" fill="#f3f7f9"/>
  <rect class="cell" x="1025" y="548" width="505" height="125" fill="#f3f7f9"/>
  <text class="key" x="92" y="575"><tspan x="92">4-1-7-1　★3・★4</tspan><tspan x="92" dy="29">4-1-7-2　★4</tspan><tspan x="92" dy="29">アクセス権の管理ルール</tspan></text>
  <text class="body" x="522" y="587"><tspan x="522">ユーザ・グループ単位で</tspan><tspan x="522" dy="32">VPN接続の許可対象を設定</tspan></text>
  <text class="body" x="1047" y="587"><tspan x="1047">必要最小限の到達範囲／申請承認・台帳</tspan><tspan x="1047" dy="32">★4：年1回以上のアクセス権棚卸</tspan></text>

  <rect class="cell" x="70" y="673" width="430" height="125" fill="#fff"/>
  <rect class="cell" x="500" y="673" width="525" height="125" fill="#fff"/>
  <rect class="cell" x="1025" y="673" width="505" height="125" fill="#fff"/>
  <text class="key" x="92" y="700"><tspan x="92">4-4-3-1～4-4-3-3</tspan><tspan x="92" dy="29">★4</tspan><tspan x="92" dy="29">ログの取得</tspan></text>
  <text class="body" x="522" y="712"><tspan x="522">RADIUS認証ログで</tspan><tspan x="522" dy="32">ユーザと認証成功・失敗を確認</tspan></text>
  <text class="body" x="1047" y="697"><tspan x="1047">必要項目の取得・6か月保管</tspan><tspan x="1047" dy="30">月1回以上の確認</tspan><tspan x="1047" dy="30">インターネット経由の閲覧には多要素認証</tspan></text>

  <text class="note" x="70" y="842">リモートアクセスVPN利用者認証に関する関連項目を整理したものです。各要求事項の充足には、VPN装置の設定と組織の運用を含む確認が必要です。</text>
  <text class="note" x="70" y="873">出典：IPA「★3・★4 要求事項・評価基準」（2026年4月21日公開、2026年10月5日確認）</text>
</svg>
